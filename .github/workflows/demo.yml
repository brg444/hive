# Serves the demo hive's state on GitHub Pages, for trying the Hive plugin for Buzz without running a
# host: https://<owner>.github.io/<repo>/demo/hive/v1/state. It is sample data, regenerated every six
# hours so its times stay current. Turn it on once under Settings → Pages → Source: GitHub Actions.
name: Demo hive state

on:
  push:
    branches: [main]
    paths: ["hive/hive-buzz/demo/**", ".github/workflows/demo.yml"]
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node hive/hive-buzz/demo/make-state.mjs _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
