[package]
name = "pay-arkade"
version = "0.1.0"
edition = "2024"
publish = false
description = "Pay for MeshLLM models in bitcoin on Arkade"

[dependencies]
mesh-llm-plugin = { git = "https://github.com/Mesh-LLM/mesh-llm.git", tag = "v0.79.0" }
anyhow = "1"
getrandom = "0.3"
hex = "0.4"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }

[profile.dev]
debug = 0
